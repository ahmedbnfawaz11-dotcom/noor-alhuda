name: noor_alhuda
description: Noor Al-Huda Islamic digital library starter app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  pdfrx: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/books/shafii_jima_alilm.json
    - assets/books/thalathat_alusul.json
    - assets/books/alqawaid_alarbaa.json
    - assets/hadith/hadiths.json
